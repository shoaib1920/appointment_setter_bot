<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;
const C = window.CONFIG;

/* ============================== UTILITIES ============================== */
const sleep = ms => new Promise(r => setTimeout(r, ms));
let _uid = 0;
const uid = () => (++_uid).toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const OFF = C.hours.utcOffsetMinutes * 60000;
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

// All scheduling is done in PKT, independent of the visitor's device timezone.
const pktNow = () => new Date(Date.now() + OFF);
const ymdOf = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
const todayYmd = () => ymdOf(pktNow());
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const addDays = (s, n) => { const d = parseYmd(s); d.setUTCDate(d.getUTCDate() + n); return ymdOf(d); };
const dow = s => parseYmd(s).getUTCDay();
const fmtDay = s => { const d = parseYmd(s); return `${DAYS[d.getUTCDay()]}, ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`; };

const allSlotTimes = () => { const out = []; for (let m = toMin(C.hours.open); m + C.hours.slotMinutes <= toMin(C.hours.close); m += C.hours.slotMinutes) out.push(fromMin(m)); return out; };
const isWorkingDay = s => C.hours.workingDays.includes(dow(s));
const isBooked = (appts, date, time, ignoreId) => appts.some(a => a.date === date && a.time === time && a.status !== "Cancelled" && a.id !== ignoreId);
const freeSlots = (appts, date, ignoreId) => {
  if (!isWorkingDay(date)) return [];
  const cutoff = Date.now() + C.hours.minLeadMinutes * 60000;
  return allSlotTimes().filter(t => slotEpoch(date, t) > cutoff && !isBooked(appts, date, t, ignoreId));
};
const nextDays = (n, from) => Array.from({ length: n }, (_, i) => addDays(from || todayYmd(), i));
const availableDays = (appts, ignoreId) => nextDays(C.hours.daysAhead).map(d => ({ date: d, slots: freeSlots(appts, d, ignoreId) })).filter(x => x.slots.length);

const downloadFile = (name, content, type) => {
  try {

    const a = document.createElement("a");

};

/* ============================== LEAD SCORING ============================== */
function scoreLead(a) {
  const min = countryOf(a.country)?.minBudgetLakh ?? C.otherCountryMinBudgetLakh;
  const g = a.gradesKind === "cgpa" ? a.gradesValue / (a.gradesScale || 4) >= C.scoring.minCgpaRatio
          : a.gradesKind === "percent" ? a.gradesValue >= C.scoring.minPercent : false;
  const e = !!a.englishDone;
  const b = a.budgetLakh != null && a.budgetLakh >= min;
  const months = a.intakeDate ? monthsBetween(todayYmd(), a.intakeDate) : null;
  const i = months != null && months >= 0 && months <= C.scoring.intakeWithinMonths;
  const cl = countryLabel(a);
  const checks = [
    { ok: g, short: "Grades", label: g ? `Good grades (${a.grades})` : `Grades below target (${a.grades || "n/a"})` },
    { ok: e, short: "English test", label: e ? `English test done (${a.english})` : "No English test yet" },
    { ok: b, short: "Budget", label: b ? `Budget fits ${cl} (~${a.budgetLakh} lakh)` : a.budgetLakh == null ? "Budget unclear" : `Budget below typical ${cl} range` },
    { ok: i, short: "Intake ≤9 mo", label: i ? `Intake in ${months} mo (${a.intake})` : months == null ? "Intake not decided" : months < 0 ? "Intake date passed" : `Intake ${months} mo away (${a.intake})` },
  ];
  const pts = checks.filter(x => x.ok).length;
  return { level: pts === 4 ? "Hot" : pts >= 2 ? "Warm" : "Cold", pts, checks };
}

const ROMAN = new Set("hai hain hay hy kya kia mein mai main nahi nahin nai chahta chahti chahiye chaiye kitni kitna kitne aap ap mujhe mujhay muje kab kaise kese kaisay theek thik haan han shukriya shukria acha achha accha karna karni karta karti kar krna hoon hun ho ka ki ke ko se bhi abhi baad batao bataen bataein bta mera meri mere naam raha rahi wala wali kuch sirf agar lekin magar paisay paise ji jee yar yaar bhai kahan kyun kyon sakta sakti hoga hogi dena lena lagta parhna parhai parhni chahta hu hy wese waise matlab kahin koi aur".split(" "));
const EN = new Set("the is are i my what how want study and have am would like need will when which about with it this that thanks thank please can you your do does for of".split(" "));
function detectLang(text, cur) {
  if (hasUrdu(text)) return "ur";
  const words = text.toLowerCase().match(/[a-z']+/g) || [];
  if (!words.length) return cur;
  let r = 0, e = 0;
  for (const w of words) { if (ROMAN.has(w)) r++; if (EN.has(w)) e++; }
  if (r >= 2 && r >= e) return "ru";
  if (r === 1 && e === 0 && words.length <= 4) return "ru";
  if (e >= 1 && e > r) return "en";
  return cur;
}

const QUESTION_RX = /\?|؟|^\s*(what|how|why|when|where|which|can|could|is|are|do|does|will|should)\b|\b(kya|kia|kaise|kese|kaisay|kitni|kitna|kitne|kahan|kyun|kyon|konsa|kaunsa)\b|کیسے|کتنی|کتنا|کیوں/i;
const isQuestion = t => QUESTION_RX.test(t);
const NAME_STOP = new Set("visa fee fees ielts pte germany italy uk france study hello hi hey what how yes no ok okay kya hai nahi thanks thank later baad guarantee price cost cancel reschedule book booking admission scholarship university help info information the is are please sure idk haan ji acha theek student parent bachelor bachelors master masters intermediate abroad consultation salam aoa assalam".split(" "));

function extractName(text) {
  let t = text.trim().replace(/[.!,]+$/, "");
  t = t.replace(/^(hi|hello|salam|aoa)[,!\s]+/i, "");
  t = t.replace(/^(my name is|my name's|name is|my name|i am|i'm|im|this is|it's|mera naam|mera name|naam|main|mein)\s+/i, "");
  t = t.replace(/\s+(hai|hy|he|hoon|hun|here)$/i, "");
  if (!/^[A-Za-z\u0600-\u06FF][A-Za-z\u0600-\u06FF .'-]{1,39}$/.test(t)) return null;
  const words = t.split(/\s+/);
  if (words.length > 4 || words.some(w => NAME_STOP.has(w.toLowerCase()))) return null;
  return titleCase(t);
}

function matchCountry(text) {
  const t = " " + text.toLowerCase() + " ";
  for (const c of C.countries) if (c.aliases.some(a => new RegExp(`(^|[^a-z])${a.replace(/[.]/g, "\\.")}([^a-z]|$)`).test(t))) return { country: c.name };
  for (const o of C.otherCountries) if (t.includes(o.toLowerCase())) return { country: "Other", other: o };
  if (/\bother|koi aur|aur country|کوئی اور/.test(t)) return { country: "Other" };
  return null;
}

function parseEducation(text, strict) {
  const t = text.toLowerCase();
  if (/\b(master|masters|ms|mphil|msc|mba|ma|mcs|mcom)\b|ماسٹر/.test(t)) return `Master's${/\b(ms|msc|mba|mphil|mcs)\b/.test(t) ? " (" + t.match(/\b(ms|msc|mba|mphil|mcs)\b/)[1].toUpperCase() + ")" : ""}`;
  if (/\b(bachelor|bachelors|bs|bsc|ba|bcom|bba|be|bcs|bds|mbbs|graduat\w*|undergrad\w*|degree)\b|بیچلر|گریجویشن/.test(t)) return "Bachelor's";
  if (/\b(inter|intermediate|fsc|f\.sc|fa|ics|icom|a ?levels?|matric|o ?levels?|hssc|12th)\b|انٹر|میٹرک/.test(t)) return "Intermediate / A-Levels";
  if (!strict && text.length <= 50) return titleCase(text.trim());
  return null;
}

function parseGrades(text) {
  const t = text.toLowerCase().replace(/,/g, "");
  let m = t.match(/(\d{2,4})\s*\/\s*(\d{3,4})/);
  if (m) { const p = +m[1] / +m[2] * 100; if (p > 0 && p <= 100) return { kind: "percent", value: Math.round(p * 10) / 10, scale: null, label: `${Math.round(p)}% (${m[1]}/${m[2]})` }; }
  m = t.match(/(\d+(?:\.\d+)?)\s*(?:\/\s*(4|5|10)\b)?/);
  if (!m) return null;
  const v = parseFloat(m[1]);
  if (/%|percent|fees?ad|فیصد|marks/.test(t) || v > 10) { if (v <= 0 || v > 100) return null; return { kind: "percent", value: v, scale: null, label: `${v}%` }; }
  const scale = m[2] ? +m[2] : v <= 4 ? 4 : v <= 5 ? 5 : 10;
  if (v <= 0 || v > scale) return null;
  return { kind: "cgpa", value: v, scale, label: `${v}/${scale} CGPA` };
}

function parseEnglish(text) {
  const t = text.toLowerCase();
  const tests = [["IELTS", /ielts|آئلٹس/], ["PTE", /\bpte\b/], ["Duolingo", /duolingo|\bdet\b/], ["TOEFL", /toefl/], ["MOI letter", /\bmoi\b|medium of instruction/]];
  if (/not yet|\bno\b|\bnope\b|nahi|nahin|\bnai\b|none|haven'?t|have not|not taken|not given|planning|plan to|ابھی نہیں|نہیں/.test(t)) return { none: true };
  for (const [name, rx] of tests) if (rx.test(t)) { const n = t.match(/(\d+(?:\.\d+)?)/); return { test: name, score: name === "MOI letter" ? "✓" : n ? n[1] : null }; }
  const n = t.match(/^\s*(\d(?:\.\d)?)\s*(bands?)?\s*$/);
  if (n) return { test: "IELTS", score: n[1] };
  return null;
}

function upcomingIntakes(count = 3) {
  const [y, m] = todayYmd().split("-").map(Number);
  const out = [];
  for (let k = 1; out.length < count && k < 36; k++) {
    const tot = y * 12 + (m - 1) + k, yy = Math.floor(tot / 12), mm = (tot % 12) + 1;
    if (C.intakeMonths.includes(mm)) out.push({ label: `${MONTHS[mm - 1]} ${yy}`, date: `${yy}-${pad(mm)}-01` });
  }
  return out;
}
const MONTH_RX = [/\bjan(uary)?\b|جنوری/, /\bfeb(ruary)?\b|\bspring\b|فروری/, /\bmar(ch)?\b|مارچ/, /\bapr(il)?\b|\bsummer\b|اپریل/, /\bmay\b|مئی/, /\bjune?\b|جون/, /\bjuly?\b|جولائی/, /\baug(ust)?\b|اگست/, /\bsep(t|tember)?\b|\bfall\b|\bautumn\b|ستمبر/, /\boct(ober)?\b|\bwinter\b|اکتوبر/, /\bnov(ember)?\b|نومبر/, /\bdec(ember)?\b|دسمبر/];
function parseIntake(text) {
  const t = text.toLowerCase();
  if (/not sure|pata nahi|pta nahi|no idea|undecided|any|decide nahi|طے نہیں|معلوم نہیں/.test(t)) return { label: "Not decided", date: null };
  let mo = null; MONTH_RX.forEach((rx, i) => { if (mo == null && rx.test(t)) mo = i + 1; });
  let yr = null; const ym = t.match(/\b(20[2-3]\d)\b/) || t.match(/'(\d{2})\b/) || (mo ? t.match(/\b(2[5-9]|3[0-2])\b/) : null);
  if (ym) yr = ym[1].length === 2 ? 2000 + +ym[1] : +ym[1];
  if (!mo && !yr) return null;
  const [cy, cm] = todayYmd().split("-").map(Number);
  if (mo && !yr) yr = mo > cm ? cy : cy + 1;
  if (!mo) return { label: `${yr} (month TBD)`, date: `${yr}-09-01` };
  return { label: `${MONTHS[mo - 1]} ${yr}`, date: `${yr}-${pad(mo)}-01` };
}

function parseBudget(text, strict) {
  const t = text.toLowerCase().replace(/,/g, "");
  if (/not sure|pata nahi|pta nahi|no idea|decide nahi|معلوم نہیں/.test(t)) return { label: "Not sure", lakh: null };
  const cur = /€|eur|euro/.test(t) ? "EUR" : /£|gbp|pound/.test(t) ? "GBP" : "PKR";
  let m = t.match(/(\d+(?:\.\d+)?)\s*(?:-|–|to|se)\s*(\d+(?:\.\d+)?)\s*(lakh|lac|lacs|lakhs|k|thousand|million|mn|m|crore|cr|hazar|hazaar)?/);
  let n, u;
  if (m) { n = (parseFloat(m[1]) + parseFloat(m[2])) / 2; u = m[3] || ""; }
  else { m = t.match(/(\d+(?:\.\d+)?)\s*(lakh|lac|lacs|lakhs|l\b|k\b|thousand|million|mn|m\b|crore|cr|hazar|hazaar)?/); if (!m) return strict || isQuestion(text) || text.length > 40 ? null : { label: text.trim(), lakh: null }; n = parseFloat(m[1]); u = m[2] || ""; }
  let val = n;
  if (/^(lakh|lac|lacs|lakhs|l)$/.test(u)) val = n * 1e5;
  else if (/^(k|thousand|hazar|hazaar)$/.test(u)) val = n * 1e3;
  else if (/^(million|mn|m)$/.test(u)) val = n * 1e6;
  else if (/^(crore|cr)$/.test(u)) val = n * 1e7;
  else if (cur === "PKR" && n <= 500) val = n * 1e5;   // "25" → assume lakh
  const rate = cur === "EUR" ? C.fx.EUR : cur === "GBP" ? C.fx.GBP : 1;
  const lakh = Math.round(val * rate / 1e5);
  return { label: cur === "PKR" ? `~${lakh} lakh PKR` : `${cur} ${Math.round(val).toLocaleString()} (~${lakh} lakh PKR)`, lakh };
}

function parseDecider(text) {
  const t = text.toLowerCase();
  if (/both|dono|together|mil ?kar|دونوں/.test(t)) return "Both";
  if (/parent|father|mother|abbu|\babu\b|ammi|papa|\bmama\b|walid|family|guardian|والد|والدہ|والدین|ابو|امی/.test(t)) return "Parent";

}

const WEEKDAY_RX = [/\bsun(day)?\b|itwar|اتوار/, /\bmon(day)?\b|\bpeer\b|\bpir\b|پیر/, /\btue(s|sday)?\b|mangal|منگل/, /\bwed(nesday)?\b|budh|بدھ/, /\bthu(r|rs|rsday)?\b|jumerat|جمعرات/, /\bfri(day)?\b|\bjum(m)?a\b|جمعہ/, /\bsat(urday)?\b|hafta|ہفتہ/];
function parseDay(text, days) {
  const t = text.toLowerCase(), T = todayYmd();
  let target = null;
  if (/today|\baaj\b|آج/.test(t)) target = T;
  else if (/day after|parson|پرسوں/.test(t)) target = addDays(T, 2);
  else if (/tomorrow|\bkal\b|کل/.test(t)) target = addDays(T, 1);
  else { for (let i = 0; i < 7; i++) if (WEEKDAY_RX[i].test(t)) { target = days.find(d => dow(d.date) === i)?.date; break; } }
  if (!target) { const m = t.match(/\b(\d{1,2})\b/); if (m) target = days.find(d => +d.date.slice(8) === +m[1])?.date; }
  return target && days.some(d => d.date === target) ? target : null;
}
function parseTime(text, slots) {
  const t = text.toLowerCase();
  const m = t.match(/(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm|baje|bje)?/);
  if (!m) return null;
  let h = +m[1]; const mi = m[2] ? +m[2] : 0; const ap = m[3];
  if (ap === "pm" && h < 12) h += 12;
  if (ap === "am" && h === 12) h = 0;
  if ((!ap || /baje|bje/.test(ap)) && h >= 1 && h <= 7) h += 12;
  const v = `${pad(h)}:${pad(mi)}`;
  return slots.includes(v) ? v : null;
}
const YES_RX = /^(yes|yeah|yep|ok|okay|confirm|haan|han|ji|jee|theek|thik|done|sure|book|جی|ہاں|ٹھیک)/i;

function detectIntent(text) {
  const t = text.toLowerCase().trim();
  if (/reschedul|cancel|postpone|change (my )?(booking|appointment|time)|booking (change|cancel)|\bgp-?\s?\d{3,}|منسوخ/.test(t)) return { type: "manage" };
  if (/baad (mein|me|main)|\blater\b|not now|abhi nahi|soch(ta|ti|kar| ke)|think about it|let me think|phir kabhi|بعد میں|سوچ/.test(t)) return { type: "later" };
  if (/just (want )?info|only (want )?info|sirf info|sirf maloomat|bas maloomat|information chahiye|just asking|just checking/.test(t)) return { type: "info" };
  for (const f of C.faqs) if (new RegExp(f.keys, "i").test(t)) return { type: "faq", faq: f };
  if (/counsel+or (se|to)|talk to|speak to|human|real person|insaan|call me|contact|aap ka number|your number|whatsapp number/.test(t)) return { type: "human" };
  if (/^(hi|hey|hello|salam|salaam|aoa|assalam|asalam|as-salam|السلام)/.test(t) && t.split(/\s+/).length <= 4) return { type: "hello" };
  if (/^(thanks|thank you|thx|shukriya|shukria|jazak|شکریہ)/.test(t)) return { type: "thanks" };
  if (/\b(book|appointment|consultation|slot|meeting|milna)\b/.test(t)) return { type: "book" };
  return null;
}

/* ============================== AI (optional) ============================== */
async function aiReply(userText, lang, question, history) {
  const ai = C.ai;
  if (!ai.enabled) return null;
  const hasClaude = typeof window.claude?.complete === "function";
  if (!hasClaude && !ai.endpoint) return null;
  const system = fill(ai.systemPrompt);
  const langName = lang === "ur" ? "Urdu (Urdu script)" : lang === "ru" ? "Roman Urdu (Urdu written in English letters)" : "English";
  const knowledge = C.faqs.map(f => `- ${f.q} ${fill(f.a.en)}`).join("\n");
  const convo = history.slice(-8).filter(m => m.kind === "text").map(m => `${m.from === "user" ? "User" : "Assistant"}: ${m.text}`).join("\n");
  const prompt = `${system}

BUSINESS: ${C.brand.name}, ${C.brand.address}. Hours: ${C.hours.label}. Sessions: ${C.sessionTypes.map(s => s.name).join("; ")}.
KNOWLEDGE (general — figures change):
${knowledge}

RECENT CONVERSATION:
${convo}

The assistant is currently waiting for the user to answer: "${question}"
The user just wrote: "${userText}"

Write ONLY the assistant's next reply, in ${langName}. 1–3 short lines. If it's a relevant question, answer briefly and generally; if off-topic, steer back politely. End by gently re-asking what we're waiting for.`;
  try {
    const call = hasClaude
      ? window.claude.complete(prompt)
      : fetch(ai.endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ system, prompt }) }).then(r => r.json()).then(j => j.reply || j.text || j.content);
    const out = await Promise.race([call, sleep(ai.timeoutMs).then(() => null)]);
    if (typeof out !== "string") return null;
    let r = out.trim().replace(/^["']+|["']+$/g, "");
    if (!r) return null;
    if (r.length > 600) r = r.slice(0, 600) + "…";
    // compliance guard: drop anything that sounds like a promise
    if (/(guarantee[ds]?|assured?)\s+(a\s+)?(visa|admission|approval|success)|\b\d{2,3}\s*%\s*(success|approval|visa)/i.test(r) && !/\b(no|not|cannot|can't|nahi|koi bhi)\b/i.test(r)) return null;
    return r;
  } catch (e) { return null; }
}

const icsEsc = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
function downloadICS(a) {
  const s = sessionOf(a.session);
  const start = slotEpoch(a.date, a.time), end = start + s.minutes * 60000;
  const f = ms => new Date(ms).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const loc = a.session === "office" ? C.brand.address : a.session === "online" ? "Online — link will be shared on WhatsApp" : "Phone / WhatsApp call";
  const desc = `Booking ID: ${a.id}\nCountry: ${countryLabel(a)}\nPlease have ready: ${C.documents.join("; ")}\nQuestions? ${C.brand.phoneDisplay}`;
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", `PRODID:-//${C.brand.short}//Booking//EN`, "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "BEGIN:VEVENT",
    `UID:${a.id}-${start}@${C.brand.short.replace(/\s+/g, "").toLowerCase()}`, `DTSTAMP:${f(Date.now())}`, `DTSTART:${f(start)}`, `DTEND:${f(end)}`,
    `SUMMARY:${icsEsc(s.name + " — " + C.brand.name)}`, `DESCRIPTION:${icsEsc(desc)}`, `LOCATION:${icsEsc(loc)}`,
    "BEGIN:VALARM", "TRIGGER:-PT1H", "ACTION:DISPLAY", "DESCRIPTION:Consultation reminder", "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  downloadFile(`${a.id}.ics`, ics, "text/calendar");
}
const waLink = a => {

};

/* ============================== CHAT WIDGET ============================== */
const BOOKING_STEPS = ["country", "otherCountry", "name", "education", "grades", "english", "englishScore", "intake", "budget", "decider", "phone", "session", "day", "time", "confirm"];
const freshState = () => ({ step: "idle", lang: "en", lead: {}, started: false, queue: Promise.resolve(), manage: {}, rescheduleId: null, day: null, presetSession: null, pausedStep: null, pendingTest: null, userClosed: false });

function ChatWidget({ appts, addAppt, updateAppt, apiRef, hidden, mode = "float" }) {
  const page = mode === "page";   // "page" = full-page booking assistant, "float" = bubble widget
  const [open, setOpen] = useState(page);
  const [msgs, setMsgs] = useState([]);
  const [chips, setChips] = useState([]);
  const [typing, setTyping] = useState(false);
  const [input, setInput] = useState("");
  const [unread, setUnread] = useState(0);
  const [peek, setPeek] = useState(false);
  const S = useRef(freshState());
  const gen = useRef(0);
  const apptsRef = useRef(appts); apptsRef.current = appts;
  const msgsRef = useRef(msgs); msgsRef.current = msgs;
  const openRef = useRef(open); openRef.current = open;
  const hiddenRef = useRef(hidden); hiddenRef.current = hidden;
  const endRef = useRef(null), inputRef = useRef(null);

  const T = (k, v) => tr(k, S.current.lang, v);
  const first = () => (S.current.lead.name || "").split(" ")[0];

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth", block: "end" }); }, [msgs, typing, chips, open]);

  const push = m => {
    setMsgs(p => [...p, { id: uid(), time: Date.now(), ...m }]);
    if (m.from === "bot" && !openRef.current) setUnread(u => u + 1);
  };
  const enqueue = fn => { const g = gen.current; S.current.queue = S.current.queue.then(() => g === gen.current && fn(g)).catch(e => console.error(e)); return S.current.queue; };

  // bot speaks: items one by one with typing indicator, then shows quick replies
  const say = (items, nextChips) => enqueue(async g => {
    setChips([]);
    for (const it of [].concat(items).filter(Boolean)) {
      const m = typeof it === "string" ? { kind: "text", text: it } : it;
      setTyping(true);
      await sleep(m.kind === "text" ? Math.min(1300, 420 + m.text.length * 11) : 650);
      if (g !== gen.current) return;
      setTyping(false);
      push({ from: "bot", ...m });
      await sleep(90);
    }
    if (nextChips && g === gen.current) setChips(nextChips);
  });

  const ch = (k, value) => ({ label: T(k), value });
  const doneChips = () => [ch("c_question", "act:question"), ch("c_new", "act:new"), ch("c_manage", "act:manage")];
  const faqChips = () => C.faqs.filter(f => f.chip).slice(0, 6).map(f => ({ label: f.chip, value: "faq:" + f.id }));
  const countryChips = () => [...C.countries.map(c => ({ label: c.name, value: "country:" + c.name, flag: c })), ch("c_other", "country:Other"), ch("c_question", "act:question"), ch("c_manage", "act:manage")];

  // what to ask at each step
  const stepUI = step => {
    const s = S.current, L = s.lead;
    switch (step) {
      case "country": return { q: T("askCountry"), chips: countryChips() };
      case "otherCountry": return { q: T("otherCountry"), chips: C.otherCountrySuggestions.map(o => ({ label: o, value: "other:" + o })) };
      case "name": return { q: T("askName"), chips: [] };
      case "education": return { q: T("askEducation"), chips: C.educationLevels.map(e => ({ label: e, value: "edu:" + e })) };
      case "grades": return { q: T("askGrades"), chips: [] };
      case "english": return { q: T("askEnglish"), chips: [{ label: "IELTS", value: "eng:IELTS" }, { label: "PTE", value: "eng:PTE" }, { label: "Duolingo", value: "eng:Duolingo" }, ch("c_notyet", "eng:none")] };
      case "englishScore": return { q: T("askScore", { test: s.pendingTest }), chips: [ch("c_dontRemember", "act:skipScore")] };
      case "intake": return { q: T("askIntake"), chips: [...upcomingIntakes(3).map(i => ({ label: i.label, value: "intake:" + i.date })), ch("c_notsure", "intake:none")] };
      case "budget": return { q: T("askBudget"), chips: C.budgetRanges.map((b, i) => ({ label: b.label, value: "budget:" + i })) };
      case "decider": return { q: T("askDecider"), chips: [ch("c_student", "decider:Student"), ch("c_parent", "decider:Parent"), ch("c_both", "decider:Both")] };
      case "phone": return { q: T("askPhone"), chips: [] };
      case "session": return { q: T("askSession"), chips: C.sessionTypes.map(x => ({ label: `${x.icon} ${x.name}`, value: "session:" + x.id })) };
      case "day": {
        const days = availableDays(apptsRef.current, s.rescheduleId);
        if (!days.length) return { q: T("noDays"), chips: doneChips(), dead: true };
        return { q: T("askDay"), chips: days.map(d => ({ label: `${dayLabel(d.date) === fmtDay(d.date) ? fmtDay(d.date) : dayLabel(d.date) + " · " + fmtDay(d.date).split(", ")[1]} · ${d.slots.length} free`, value: "day:" + d.date })) };
      }
      case "time": {
        const slots = freeSlots(apptsRef.current, s.day, s.rescheduleId);
        return { q: T("askTime", { day: dayLabel(s.day) }), chips: [...slots.map(t => ({ label: fmtTime(t), value: "time:" + t, small: true })), ch("c_otherDay", "act:otherDay")] };
      }
      case "confirm": return { q: [T("summary"), { kind: "summary", data: { ...L } }], chips: [ch("c_confirm", "act:confirm"), ch("c_change", "act:change")] };
      case "manageId": return { q: T("manageId"), chips: [] };
      case "managePhone": return { q: T("managePhone"), chips: [] };
      default: return { q: T("anythingElse"), chips: doneChips() };
    }
  };

  const ask = (step, pre = []) => {
    S.current.step = step;
    const ui = stepUI(step);
    if (ui.dead) S.current.step = "done";
    if (step === "time" && ui.chips.length <= 1) { S.current.step = "day"; return ask("day", [...[].concat(pre), T("slotTaken")]); }
    return say([...[].concat(pre), ...[].concat(ui.q)], ui.chips);
  };

  const reprompt = (pre = []) => {
    const st = S.current.step;
    if (st === "idle" || st === "done") return say([...[].concat(pre), T("anythingElse")], doneChips());
    if (st === "country") return say([...[].concat(pre), T("askCountryAfterFaq")], countryChips());
    const ui = stepUI(st);
    const q = typeof ui.q === "string" ? `${T("back")} ${ui.q}` : ui.q;
    return say([...[].concat(pre), ...[].concat(q)], ui.chips);
  };

  /* ---------- accepting an answer for the current step ---------- */
  const accept = (step, val) => {
    const s = S.current, L = s.lead;
    switch (step) {
      case "country":
        if (val.country === "Other") { if (val.other) return accept("otherCountry", val.other); return ask("otherCountry"); }
        L.country = val.country; L.countryOther = null;
        return ask(L.name ? "education" : "name", [T("countryAck", { country: val.country })]);
      case "otherCountry":
        L.country = "Other"; L.countryOther = titleCase(val);
        return ask("name", [T("otherAck", { country: L.countryOther })]);
      case "name":
        L.name = val; return ask("education", [T("niceMeet", { first: val.split(" ")[0] })]);
      case "education":
        L.education = val; return ask("grades");
      case "grades":
        L.grades = val; return ask("english", [T("gotIt")]);
      case "english":
        if (val.none) { L.english = { label: "Not yet", test: "None", score: null, done: false }; return ask("intake", [T("englishNone")]); }
        if (val.score == null) { s.pendingTest = val.test; return ask("englishScore"); }
        L.english = { label: `${val.test} ${val.score}`, test: val.test, score: val.score, done: true };
        return ask("intake", [T("niceScore")]);
      case "englishScore":
        L.english = { label: val === "—" ? `${s.pendingTest} (score n/a)` : `${s.pendingTest} ${val}`, test: s.pendingTest, score: val === "—" ? null : val, done: true };
        return ask("intake", [T("niceScore")]);
      case "intake": L.intake = val; return ask("budget");
      case "budget": L.budget = val; return ask("decider");
      case "decider": L.decider = val; return ask("phone");
      case "phone":
        L.phone = val;
        if (s.presetSession) { L.session = s.presetSession; return ask("day", [T("thanksPhone")]); }
        return ask("session");
      case "session": L.session = val; return ask("day");
      case "day": s.day = val; return ask("time");
      case "time": L.date = s.day; L.time = val; return ask("confirm");
      case "confirm": return val === "yes" ? finalize() : ask("day");
      case "manageId": s.manage = { id: val }; return ask("managePhone");
      case "managePhone": return findBooking(val);
      default: return reprompt();
    }
  };

  const finalize = () => {
    const s = S.current, L = s.lead, appts = apptsRef.current;
    if (isBooked(appts, L.date, L.time, s.rescheduleId) || slotEpoch(L.date, L.time) <= Date.now()) return ask("time", [T("slotTaken")]);
    if (s.rescheduleId) {
      const id = s.rescheduleId;
      const old = appts.find(a => a.id === id);
      updateAppt(id, { date: L.date, time: L.time, status: old?.status === "Cancelled" ? "New" : old?.status === "Completed" || old?.status === "No-show" ? "New" : old?.status || "New", rescheduledAt: Date.now() });
      s.rescheduleId = null; s.step = "done";
      return say([T("rescheduled", { id }), { kind: "success", data: { ...old, date: L.date, time: L.time } }], doneChips());
    }
    const max = appts.reduce((m, a) => Math.max(m, parseInt(String(a.id).replace(/\D/g, ""), 10) || 0), C.booking.startId - 1);
    const appt = {
      id: C.booking.idPrefix + (max + 1), createdAt: Date.now(), status: "New", lang: s.lang, source: "Chatbot",
      name: L.name, phone: L.phone, country: L.country, countryOther: L.countryOther || null, education: L.education,
      grades: L.grades?.label, gradesKind: L.grades?.kind, gradesValue: L.grades?.value, gradesScale: L.grades?.scale,
      english: L.english?.label, englishTest: L.english?.test, englishScore: L.english?.score, englishDone: !!L.english?.done,
      budget: L.budget?.label, budgetLakh: L.budget?.lakh ?? null, intake: L.intake?.label, intakeDate: L.intake?.date || null,
      decider: L.decider, session: L.session, date: L.date, time: L.time,
    };
    addAppt(appt);
    s.step = "done"; s.presetSession = null;
    return say([T("booked", { first: first() }), { kind: "success", data: appt }], doneChips());
  };

  const findBooking = phone => {
    const s = S.current;
    const b = apptsRef.current.find(a => a.id.toUpperCase() === s.manage.id && a.phone === phone);
    if (!b) { s.step = "done"; return say(T("manageNotFound"), [ch("c_tryAgain", "act:manage"), ch("c_new", "act:new")]); }
    s.manage.bookingId = b.id; s.step = "done";
    if (b.status === "Cancelled") return say([{ kind: "booking", data: b }, T("alreadyCancelled")], [ch("c_new", "act:new"), ch("c_question", "act:question")]);
    return say([T("manageFound"), { kind: "booking", data: b }], [ch("c_reschedule", "act:reschedule"), ch("c_cancelBooking", "act:cancelBooking"), ch("c_keep", "act:keep")]);
  };

  /* ---------- parse free text for the current step ---------- */
  const parseStep = (step, text, strict) => {
    const q = isQuestion(text);
    switch (step) {
      case "country": return q ? null : matchCountry(text);
      case "otherCountry": { if (q) return null; const m = matchCountry(text); if (m) return m.other || (m.country !== "Other" ? { redirect: m.country } : null); return !strict && text.length <= 30 && /^[a-z\s.'-]+$/i.test(text) ? text.trim() : null; }
      case "name": return q ? null : extractName(text);
      case "education": return q ? null : parseEducation(text, strict);
      case "grades": return q ? null : parseGrades(text);
      case "english": return q ? null : parseEnglish(text);
      case "englishScore": { if (/don'?t remember|yaad nahi|not sure|یاد نہیں/i.test(text)) return "—"; const m = text.match(/(\d+(?:\.\d+)?)/); return m ? m[1] : null; }
      case "intake": return q ? null : parseIntake(text);
      case "budget": return q ? null : parseBudget(text, strict);
      case "decider": return q ? null : parseDecider(text);
      case "phone": return extractPhone(text);
      case "session": return q ? null : parseSession(text);
      case "day": return parseDay(text, availableDays(apptsRef.current, S.current.rescheduleId));
      case "time": return parseTime(text, freeSlots(apptsRef.current, S.current.day, S.current.rescheduleId));
      case "confirm": return q ? null : YES_RX.test(text.trim()) ? "yes" : NO_RX.test(text) ? "no" : null;
      case "manageId": { const m = text.match(/(?:[a-z]{1,4})?\s*-?\s*(\d{3,6})/i); return m ? (C.booking.idPrefix + m[1]).toUpperCase() : null; }
      case "managePhone": return extractPhone(text);
      default: return null;
    }
  };

  const handleIntent = intent => {
    const s = S.current;
    switch (intent.type) {
      case "faq": return reprompt([faqAnswer(intent.faq, s.lang)]);
      case "later": s.pausedStep = s.step; return say(T("later"), [ch("c_bookFree", "act:bookFree"), ch("c_maybeLater", "act:maybeLater")]);
      case "info": s.pausedStep = s.step; return say(T("infoOnly"), [ch("c_bookFree", "act:bookFree"), ...faqChips().slice(0, 3)]);
      case "manage": { const m = parseStep("manageId", "x" + (/(\d{3,6})/.exec(intentText.current) || [""])[0]); if (/\d{3,}/.test(intentText.current) && m) { s.manage = { id: m }; return ask("managePhone"); } s.manage = {}; return ask("manageId"); }
      case "human": return reprompt([T("human")]);
      case "hello": return reprompt([T("hello")]);
      case "thanks": return reprompt([T("thanks")]);
      case "book": if (s.step === "idle" || s.step === "done") { s.lead = {}; return ask("country", [T("restart")]); } return reprompt();
      default: return reprompt();
    }
  };
  const intentText = useRef("");

  const fallback = (step, text) => {
    if (step === "phone" && /\d{6,}/.test(text.replace(/\D/g, ""))) return say(T("badPhone"));
    if (step === "managePhone" && /\d{6,}/.test(text)) return say(T("badPhone"));
    if (step === "grades" && !isQuestion(text)) return say(T("badGrades"));
    if (step === "name" && !isQuestion(text)) return say(T("badName"));
    if (step === "manageId") return say(T("badId"));
    if (step === "day" || step === "time") return ask(step, [T("notAvailable")]);
    return reprompt([T("steer")]);
  };

  const processText = text => {
    const s = S.current, step = s.step;
    const strict = parseStep(step, text, true);
    if (strict) { if (strict.redirect) return accept("country", { country: strict.redirect }); return accept(step, strict); }
    if (step === "phone" && !isQuestion(text) && /\d{6,}/.test(text.replace(/\D/g, ""))) return say(T("badPhone"));
    intentText.current = text;
    const intent = detectIntent(text);
    if (intent) return handleIntent(intent);
    const loose = parseStep(step, text, false);
    if (loose) { if (loose.redirect) return accept("country", { country: loose.redirect }); return accept(step, loose); }
    // AI for anything unrecognised (if available), otherwise rule-based steer-back
    const ui = stepUI(step);
    const question = typeof ui.q === "string" ? ui.q : T("anythingElse");
    enqueue(async g => {
      setTyping(true);
      const r = await aiReply(text, s.lang, question, msgsRef.current);
      if (g !== gen.current) return;
      setTyping(false);
      if (r) say(r, ui.chips); else fallback(step, text);
    });
  };

  /* ---------- quick-reply actions ---------- */
  const act = value => {
    const s = S.current;
    const i = value.indexOf(":"), k = value.slice(0, i), p = value.slice(i + 1);
    switch (k) {
      case "country": return accept("country", { country: p });
      case "other": return accept("otherCountry", p);
      case "edu": return accept("education", p);
      case "eng": return accept("english", p === "none" ? { none: true } : { test: p, score: null });
      case "intake": return accept("intake", p === "none" ? { label: "Not decided", date: null } : { label: `${MONTHS[+p.slice(5, 7) - 1]} ${p.slice(0, 4)}`, date: p });
      case "budget": { const b = C.budgetRanges[+p]; return accept("budget", { label: b.label, lakh: b.lakh }); }
      case "decider": return accept("decider", p);
      case "session": return accept("session", p);
      case "day": return accept("day", p);
      case "time": return accept("time", p);
      case "faq": { const f = C.faqs.find(x => x.id === p); return f ? handleIntent({ type: "faq", faq: f }) : reprompt(); }
      case "act":
        switch (p) {
          case "question": return say(T("askQuestion"), faqChips());
          case "new": s.lead = {}; s.rescheduleId = null; s.presetSession = null; return ask("country", [T("restart")]);
          case "manage": s.manage = {}; return ask("manageId");
          case "skipScore": return accept("englishScore", "—");
          case "otherDay": case "change": return ask("day");
          case "confirm": return accept("confirm", "yes");
          case "bookFree": case "bookNow": {
            if (p === "bookFree") s.presetSession = "discovery";
            const ps = s.pausedStep; s.pausedStep = null;
            if (ps && BOOKING_STEPS.includes(ps) && ps !== "country") { s.step = ps; if (ps === "session" && s.presetSession) return accept("session", s.presetSession); return reprompt(); }
            s.lead = {}; return ask("country");
          }
          case "maybeLater": return say(T("laterOk"), [ch("c_bookNow", "act:bookNow"), ch("c_question", "act:question")]);
          case "reschedule": {
            const b = apptsRef.current.find(a => a.id === s.manage.bookingId);
            if (!b) return reprompt();
            s.rescheduleId = b.id;
            s.lead = { name: b.name, phone: b.phone, country: b.country, countryOther: b.countryOther, session: b.session };
            return ask("day", [T("rescheduleStart")]);
          }
          case "cancelBooking": updateAppt(s.manage.bookingId, { status: "Cancelled" }); s.step = "done"; return say(T("cancelled", { id: s.manage.bookingId }), [ch("c_new", "act:new"), ch("c_question", "act:question")]);
          case "keep": s.step = "done"; return say(T("kept"), doneChips());
          default: return reprompt();
        }
      default: return reprompt();
    }
  };

  /* ---------- user input ---------- */
  const send = raw => {
    const text = (raw ?? input).trim();
    if (!text) return;
    setInput("");
    if (!S.current.started) startConversation(true);
    push({ from: "user", kind: "text", text });
    setChips([]);
    S.current.lang = detectLang(text, S.current.lang);
    processText(text);
  };
  const onChip = c => { push({ from: "user", kind: "text", text: c.label }); setChips([]); act(c.value); };

  const startConversation = silent => {
    if (S.current.started) return;
    S.current.started = true;
    S.current.step = "country";
    if (silent) return;
    say([T("greet"), T("greet2")]);
    ask("country");
  };
  const openChat = () => {
    setOpen(true); setUnread(0); setPeek(false);
    startConversation();
    if (!isMobile()) setTimeout(() => inputRef.current?.focus(), 350);
  };
  const closeChat = () => { setOpen(false); S.current.userClosed = true; };
  const restart = () => {
    gen.current++;
    S.current = freshState();
    setMsgs([]); setChips([]); setTyping(false);
    startConversation();
  };

  apiRef.current = {
    open: openChat,
    country: name => {
      const s = S.current;
      const fresh = !s.started;
      openChat();
      if (fresh || s.step === "country" || s.step === "done" || s.step === "idle") {
        if (s.step !== "country") { s.lead = {}; s.rescheduleId = null; }
        enqueue(async () => push({ from: "user", kind: "text", text: name === "Other" ? T("c_other") : name }));
        accept("country", { country: name });
      } else if (BOOKING_STEPS.includes(s.step) && name !== "Other") {
        s.lead.country = name; s.lead.countryOther = null;
        reprompt([T("countryNoted", { country: name })]);
      }
    },
  };

  useEffect(() => {
    if (page) { startConversation(); return; }
    const t = setTimeout(() => {
      if (openRef.current || S.current.userClosed || hiddenRef.current) return;
      if (isMobile() && !C.chat.autoOpenOnMobile) { startConversation(); setPeek(true); }
      else openChat();
    }, C.chat.autoOpenDelayMs);
    return () => clearTimeout(t);
  }, []);

  // tell embed.js how big the iframe on the host site needs to be
  useEffect(() => {
    if (!EMBED) return;
    try { window.parent.postMessage({ type: "gp-widget", state: open ? "open" : peek ? "peek" : "closed" }, "*"); } catch (e) {}
  }, [open, peek]);

  const lastBot = [...msgs].reverse().find(m => m.from === "bot" && m.kind === "text");

  return (
    <div className={page ? "h-full" : ""} style={{ display: hidden ? "none" : undefined }}>
      {/* Launcher */}
      {!open && (
        <div className="fixed bottom-5 right-4 sm:right-6 z-50 flex flex-col items-end gap-3">
          {peek && lastBot && (
            <button onClick={openChat} className="anim-pop max-w-[270px] text-left rounded-2xl rounded-br-sm bg-white shadow-2xl ring-1 ring-black/5 px-4 py-3 text-sm text-ink">
              <div className="text-[11px] font-semibold text-gold-deep mb-0.5">{C.botName}</div>
              <div className={hasUrdu(lastBot.text) ? "urdu text-right" : ""} dir={hasUrdu(lastBot.text) ? "rtl" : "ltr"}>{lastBot.text}</div>
            </button>
          )}
          <button onClick={openChat} aria-label="Open chat" className="relative h-16 w-16 rounded-full bg-gradient-to-br from-gold to-gold-deep text-navy shadow-2xl grid place-items-center pulse-ring hover:scale-105 transition">
            <Icon name="chat" size={28} stroke={2.2} />
            {unread > 0 && <span className="absolute -top-1 -right-1 min-w-[22px] h-[22px] px-1 rounded-full bg-rose-500 text-white text-xs font-bold grid place-items-center ring-2 ring-white">{unread}</span>}
          </button>
        </div>
      )}

      {/* Panel */}
      {open && (
        <div className={page ? "h-full flex flex-col bg-white rounded-t-3xl sm:rounded-3xl shadow-[0_30px_80px_-20px_rgba(0,0,0,.6)] overflow-hidden ring-1 ring-white/10"
          : EMBED ? "fixed inset-0 flex flex-col bg-white overflow-hidden anim-pop"
          : "fixed z-50 inset-0 sm:inset-auto sm:bottom-6 sm:right-6 sm:w-[400px] sm:h-[min(660px,calc(100vh-48px))] h-[100dvh] flex flex-col bg-white sm:rounded-3xl shadow-[0_30px_80px_-20px_rgba(10,26,58,.55)] overflow-hidden anim-pop ring-1 ring-black/5"}>
          <div className="hero-bg text-white px-4 py-3.5 flex items-center gap-3 shrink-0">
            <div className="relative">
              <div className="h-11 w-11 rounded-full bg-gradient-to-br from-gold to-gold-deep grid place-items-center text-navy"><Icon name="cap" size={22} /></div>
              <span className="absolute bottom-0 right-0 h-3 w-3 rounded-full bg-emerald-400 ring-2 ring-navy" />
            </div>
            <div className="flex-1 min-w-0">
              <div className="font-semibold leading-tight truncate">{C.botName}</div>
              <div className="text-xs text-white/70 truncate">{C.brand.name} · Online now</div>
            </div>
            <button onClick={restart} title="Start over" className="h-9 w-9 rounded-full hover:bg-white/10 grid place-items-center"><Icon name="refresh" size={17} /></button>
            {!page && <button onClick={closeChat} title="Close" className="h-9 w-9 rounded-full hover:bg-white/10 grid place-items-center"><Icon name="x" size={20} /></button>}
          </div>

          <div className="flex-1 overflow-y-auto chat-bg px-3.5 py-4 space-y-3 scroll-thin">
            <div className="text-center"><span className="inline-block text-[11px] text-slate-500 bg-white/80 rounded-full px-3 py-1 ring-1 ring-black/5">Today · Replies instantly · English / اردو / Roman Urdu</span></div>
            {msgs.map(m => <Message key={m.id} m={m} />)}
            {typing && (
              <div className="flex items-end gap-2 anim-up">
                <div className="h-7 w-7 rounded-full bg-navy text-gold grid place-items-center shrink-0"><Icon name="cap" size={14} /></div>
                <div className="bg-white rounded-2xl rounded-bl-sm px-4 py-3 shadow-sm ring-1 ring-black/5 typing"><span /><span /><span /></div>
              </div>
            )}
            {chips.length > 0 && !typing && (
              <div className="flex flex-wrap gap-2 pl-9 anim-up">
                {chips.map((c, i) => (
                  <button key={i} onClick={() => onChip(c)}
                    className={"inline-flex items-center gap-1.5 rounded-full border-[1.5px] border-gold bg-white text-navy font-semibold shadow-sm hover:bg-gold hover:text-navy active:scale-95 transition " + (c.small ? "px-3 py-1.5 text-[13px]" : "px-3.5 py-2 text-[13px]") + (hasUrdu(c.label) ? " urdu" : "")}>

                  </button>

            )}
            <div ref={endRef} />
          </div>

          <form onSubmit={e => { e.preventDefault(); send(); }} className="shrink-0 border-t border-slate-200 bg-white px-3 pt-2.5 pb-[max(10px,env(safe-area-inset-bottom))]">

              <input ref={inputRef} value={input} onChange={e => setInput(e.target.value)} placeholder="Type your message…" dir="auto"
                className="flex-1 min-w-0 rounded-full bg-slate-100 px-4 py-3 text-base sm:text-sm outline-none focus:ring-2 focus:ring-gold" />
              <button type="submit" disabled={!input.trim()} className="h-11 w-11 rounded-full bg-navy text-gold grid place-items-center disabled:opacity-40 hover:bg-navy-2 transition shrink-0" aria-label="Send"><Icon name="send" size={18} /></button>

            <div className="text-[10.5px] text-center text-slate-400 mt-1.5">Guidance only · No visa or admission guarantees · Counsellors confirm all requirements</div>
          </form>
        </div>
      )}
    </div>
  );
}

const CSV_COLS = [
  ["Booking ID", a => a.id], ["Created", a => new Date(a.createdAt).toISOString()], ["Name", a => a.name], ["Phone", a => fmtPhone(a.phone)],
  ["Country", a => countryLabel(a)], ["Education", a => a.education], ["CGPA / %", a => a.grades], ["English Test", a => a.english],
  ["Budget", a => a.budget], ["Intake", a => a.intake], ["Decision Maker", a => a.decider], ["Session", a => sessionOf(a.session).name],
  ["Date", a => a.date], ["Time (PKT)", a => fmtTime(a.time)], ["Lead Score", a => scoreLead(a).level],
  ["Lead Reason", a => scoreLead(a).checks.map(c => (c.ok ? "✓ " : "✗ ") + c.label).join(" | ")], ["Status", a => a.status], ["Language", a => ({ en: "English", ru: "Roman Urdu", ur: "Urdu" }[a.lang] || "")],
];
function exportCSV(rows) {
  const esc = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = "\uFEFF" + [CSV_COLS.map(c => esc(c[0])).join(","), ...rows.map(a => CSV_COLS.map(c => esc(c[1](a))).join(","))].join("\r\n");
  downloadFile(`appointments-${todayYmd()}.csv`, csv, "text/csv;charset=utf-8");
}

function Admin({ appts, updateAppt, resetDemo, onExit }) {
  const [tab, setTab] = useState("list");
  const [fCountry, setFCountry] = useState("All");
  const [fStatus, setFStatus] = useState("All");
  const [fLead, setFLead] = useState("All");
  const [fDate, setFDate] = useState("");
  const [q, setQ] = useState("");

  const rows = useMemo(() => appts.map(a => ({ ...a, score: scoreLead(a) })).sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0)), [appts]);
  const filtered = rows.filter(a =>
    (fCountry === "All" || a.country === fCountry) && (fStatus === "All" || a.status === fStatus) && (fLead === "All" || a.score.level === fLead) &&
    (!fDate || a.date === fDate) && (!q || `${a.name} ${a.phone} ${fmtPhone(a.phone)} ${a.id}`.toLowerCase().includes(q.toLowerCase())));

  const T = todayYmd();
  const stats = useMemo(() => {
    const counts = {}; rows.forEach(a => { const k = countryLabel(a).split(" · ")[0]; counts[k] = (counts[k] || 0) + 1; });
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    return {
      total: rows.length,
      today: rows.filter(a => a.createdAt && pktYmdOfEpoch(a.createdAt) === T).length,
      sessionsToday: rows.filter(a => a.date === T && a.status !== "Cancelled").length,
      hot: rows.filter(a => a.score.level === "Hot").length,
      top: top ? top[0] : "—", topN: top ? top[1] : 0,
    };
  }, [rows, T]);

  const sel = "rounded-xl bg-white ring-1 ring-slate-200 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-gold";
  const anyFilter = fCountry !== "All" || fStatus !== "All" || fLead !== "All" || fDate || q;

  return (
    <div className="min-h-screen bg-[#F4F2EC]">
      <header className="hero-bg text-white">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-wrap items-center justify-between gap-3">
          <div className="flex items-center gap-4"><Logo light /><span className="hidden sm:inline text-xs rounded-full bg-gold/20 text-gold ring-1 ring-gold/40 px-2.5 py-1 font-semibold">Admin Dashboard</span></div>
          <div className="flex items-center gap-2">
            <button onClick={resetDemo} className="rounded-full ring-1 ring-white/20 hover:bg-white/10 px-3.5 py-2 text-xs font-semibold flex items-center gap-1.5"><Icon name="refresh" size={14} /> <span className="hidden sm:inline">Reset demo data</span></button>
            <button onClick={onExit} className="rounded-full bg-white text-navy px-4 py-2 text-xs font-bold flex items-center gap-1.5"><Icon name="arrowLeft" size={14} /> Back to site</button>
          </div>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6">
        {/* Stats */}
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
          <Stat icon="users" label="Total leads" value={stats.total} sub={`${stats.sessionsToday} session${stats.sessionsToday === 1 ? "" : "s"} scheduled today`} />
          <Stat icon="calendar" label="Booked today" value={stats.today} sub="New bookings since midnight" />
          <Stat icon="flame" label="Hot leads" value={stats.hot} sub={`${Math.round(stats.hot / Math.max(1, stats.total) * 100)}% of all leads`} accent />
          <Stat icon="globe" label="Top country" value={stats.top} sub={`${stats.topN} lead${stats.topN === 1 ? "" : "s"}`} flag={countryOf(stats.top)} />
        </div>

        {/* Tabs + actions */}
        <div className="mt-6 flex flex-wrap items-center justify-between gap-3">
          <div className="inline-flex rounded-xl bg-white ring-1 ring-slate-200 p-1">
            {[["list", "list", "Appointments"], ["calendar", "calendar", "Calendar"], ["install", "code", "Add to website"]].map(([k, i, l]) => (
              <button key={k} onClick={() => setTab(k)} className={"px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-1.5 transition " + (tab === k ? "bg-navy text-white shadow" : "text-slate-600 hover:text-navy")}><Icon name={i} size={15} />{l}</button>
            ))}
          </div>
          <button onClick={() => exportCSV(filtered)} className="rounded-xl bg-gold text-navy px-4 py-2.5 text-sm font-bold flex items-center gap-1.5 shadow-sm hover:brightness-105"><Icon name="download" size={16} /> Export CSV {anyFilter ? `(${filtered.length})` : ""}</button>
        </div>

        {tab === "list" ? (
          <>
            <div className="mt-4 rounded-2xl bg-white ring-1 ring-black/5 p-3 flex flex-wrap gap-2 items-center">
              <div className="relative flex-1 min-w-[180px]">
                <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search name, phone or ID" className={sel + " w-full pl-9"} />
              </div>
              <select value={fCountry} onChange={e => setFCountry(e.target.value)} className={sel}><option value="All">All countries</option>{C.countries.map(c => <option key={c.name}>{c.name}</option>)}<option value="Other">Other</option></select>
              <select value={fStatus} onChange={e => setFStatus(e.target.value)} className={sel}><option value="All">All statuses</option>{STATUS.map(s => <option key={s}>{s}</option>)}</select>
              <select value={fLead} onChange={e => setFLead(e.target.value)} className={sel}><option value="All">All leads</option><option>Hot</option><option>Warm</option><option>Cold</option></select>
              <input type="date" value={fDate} onChange={e => setFDate(e.target.value)} className={sel} title="Appointment date" />
              {anyFilter && <button onClick={() => { setFCountry("All"); setFStatus("All"); setFLead("All"); setFDate(""); setQ(""); }} className="text-sm text-slate-500 hover:text-navy px-2">Clear</button>}
            </div>

            {/* Desktop table */}
            <div className="hidden lg:block mt-4 rounded-2xl bg-white ring-1 ring-black/5 overflow-hidden">
              <div className="overflow-x-auto scroll-thin">
                <table className="w-full text-sm">
                  <thead className="bg-slate-50 text-[11.5px] uppercase tracking-wide text-slate-500">
                    <tr>{["Booking / Student", "Country", "Academic profile", "Budget & intake", "Session", "Lead score", "Status"].map(h => <th key={h} className="text-left font-semibold px-4 py-3 whitespace-nowrap">{h}</th>)}</tr>
                  </thead>
                  <tbody>
                    {filtered.map(a => {
                      const s = sessionOf(a.session), fresh = Date.now() - a.createdAt < 15 * 60000;
                      return (
                        <tr key={a.id} className={"border-t border-slate-100 align-top " + (fresh ? "bg-gold-soft/40" : "hover:bg-slate-50/60")}>
                          <td className="px-4 py-3.5">
                            <div className="flex items-center gap-2"><span className="font-mono text-[12px] font-bold text-navy">{a.id}</span>{fresh && <span className="text-[10px] font-bold rounded bg-gold text-navy px-1.5">NEW</span>}</div>
                            <div className="font-semibold text-ink mt-0.5">{a.name}</div>
                            <div className="text-[12px] text-slate-500">{fmtPhone(a.phone)} · {a.decider === "Parent" ? "Parent decides" : a.decider === "Both" ? "Student + parent" : "Student decides"}</div>
                            <div className="text-[11px] text-slate-400">{a.createdAt ? timeAgo(a.createdAt) : ""}</div>
                          </td>
                          <td className="px-4 py-3.5"><div className="flex items-center gap-2 whitespace-nowrap"><Flag country={countryOf(a.country)} w={24} /> <span className="font-medium">{countryLabel(a)}</span></div></td>
                          <td className="px-4 py-3.5 text-[13px]"><div className="font-medium">{a.education}</div><div className="text-slate-500">{a.grades || "—"}</div><div className="text-slate-500">{a.english}</div></td>
                          <td className="px-4 py-3.5 text-[13px]"><div className="font-medium whitespace-nowrap">{a.budget || "—"}</div><div className="text-slate-500">Intake: {a.intake || "—"}</div></td>
                          <td className="px-4 py-3.5 text-[13px] whitespace-nowrap"><div className="font-medium">{s.icon} {s.short}</div><div className="text-slate-500">{fmtDay(a.date)}</div><div className="text-slate-500">{fmtTime(a.time)} PKT</div></td>
                          <td className="px-4 py-3.5 max-w-[230px]"><LeadBadge level={a.score.level} /><Reasons checks={a.score.checks} /></td>
                          <td className="px-4 py-3.5"><StatusSelect a={a} updateAppt={updateAppt} /></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              {!filtered.length && <Empty />}
            </div>

            {/* Mobile cards */}
            <div className="lg:hidden mt-4 space-y-3">
              {filtered.map(a => {
                const s = sessionOf(a.session);
                return (
                  <div key={a.id} className="rounded-2xl bg-white ring-1 ring-black/5 p-4">
                    <div className="flex items-start justify-between gap-3">
                      <div className="min-w-0">
                        <div className="font-mono text-[12px] font-bold text-navy">{a.id} <span className="font-sans font-normal text-slate-400">· {timeAgo(a.createdAt)}</span></div>
                        <div className="font-semibold text-ink text-base truncate">{a.name}</div>
                        <div className="text-[12.5px] text-slate-500">{fmtPhone(a.phone)} · {a.decider}</div>
                      </div>
                      <LeadBadge level={a.score.level} />
                    </div>
                    <div className="grid grid-cols-2 gap-x-3 gap-y-1.5 mt-3 text-[12.5px]">
                      <div className="flex items-center gap-1.5"><Flag country={countryOf(a.country)} w={18} className="!rounded-sm" />{countryLabel(a)}</div>
                      <div>{s.icon} {s.short}</div>
                      <div className="text-slate-600">{a.education}</div>
                      <div className="text-slate-600">{fmtDay(a.date)} · {fmtTime(a.time)}</div>
                      <div className="text-slate-600">{a.grades} · {a.english}</div>
                      <div className="text-slate-600">{a.budget} · {a.intake}</div>
                    </div>
                    <Reasons checks={a.score.checks} full />
                    <div className="mt-3"><StatusSelect a={a} updateAppt={updateAppt} /></div>
                  </div>
                );
              })}
              {!filtered.length && <div className="rounded-2xl bg-white"><Empty /></div>}
            </div>
            <p className="text-[12px] text-slate-500 mt-4">Lead score: <b>Hot</b> = good grades + English test done + budget fits + intake within {C.scoring.intakeWithinMonths} months · <b>Warm</b> = 2–3 of these · <b>Cold</b> = the rest.</p>
          </>
        ) : tab === "calendar" ? <CalendarView appts={appts} /> : <InstallView />}
      </main>
    </div>
  );
}

const Stat = ({ icon, label, value, sub, accent, flag }) => (
  <div className={"rounded-2xl p-4 sm:p-5 ring-1 " + (accent ? "bg-navy text-white ring-navy" : "bg-white ring-black/5")}>
    <div className="flex items-center justify-between">
      <div className={"text-[12px] font-semibold uppercase tracking-wide " + (accent ? "text-white/60" : "text-slate-500")}>{label}</div>
      <div className={"h-8 w-8 rounded-lg grid place-items-center " + (accent ? "bg-gold text-navy" : "bg-gold-soft text-navy")}><Icon name={icon} size={16} /></div>
    </div>
    <div className="mt-2 flex items-center gap-2"><span className="font-display text-3xl sm:text-4xl font-bold">{value}</span>{flag && <Flag country={flag} w={28} />}</div>
    <div className={"text-[12px] mt-1 " + (accent ? "text-white/60" : "text-slate-500")}>{sub}</div>
  </div>
);
const Reasons = ({ checks, full }) => {
  const miss = checks.filter(c => !c.ok);
  if (full) return <ul className="mt-3 grid grid-cols-1 gap-0.5 text-[12px]">{checks.map(c => <li key={c.short} className={c.ok ? "text-emerald-700" : "text-slate-500"}>{c.ok ? "✓" : "✗"} {c.label}</li>)}</ul>;
  return (
    <div className="mt-1.5 text-[11.5px] leading-snug cursor-help" title={checks.map(c => (c.ok ? "✓ " : "✗ ") + c.label).join("\n")}>
      <div className="text-slate-500 font-semibold">{4 - miss.length}/4 criteria met</div>
      {checks.filter(c => c.ok).length > 0 && <div className="text-emerald-700">✓ {checks.filter(c => c.ok).map(c => c.short).join(" · ")}</div>}
      {miss.length > 0 && <div className="text-rose-500/80">✗ {miss.map(c => c.label).join(" · ")}</div>}
    </div>
  );
};
const StatusSelect = ({ a, updateAppt }) => (
  <select value={a.status} onChange={e => updateAppt(a.id, { status: e.target.value })}
    className={"rounded-full px-3 py-1.5 text-xs font-semibold ring-1 outline-none cursor-pointer " + STATUS_STYLE[a.status]}>
    {STATUS.map(s => <option key={s} value={s}>{s}</option>)}
  </select>
);
const Empty = () => <div className="text-center text-slate-500 py-12 text-sm">No appointments match these filters.</div>;

function InstallView() {
  const base = location.origin + location.pathname.replace(/[^/]*$/, "");
  const snippet = `<script src="${base}embed.js" defer><\/script>`;
  const local = location.protocol === "file:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const [copied, setCopied] = useState("");
  const copy = (text, key) => {
    try { navigator.clipboard.writeText(text).then(() => { setCopied(key); setTimeout(() => setCopied(""), 1500); }); } catch (e) {}
  };
  const CopyBtn = ({ text, k }) => (
    <button onClick={() => copy(text, k)} className="shrink-0 rounded-lg bg-gold text-navy px-3 py-2 text-xs font-bold">{copied === k ? "Copied ✓" : "Copy"}</button>
  );
  return (
    <div className="mt-4 grid lg:grid-cols-2 gap-4">
      <div className="rounded-2xl bg-white ring-1 ring-black/5 p-5">
        <div className="flex items-center gap-2 font-bold text-navy text-lg"><Icon name="code" size={20} /> Add the assistant to your existing website</div>
        <p className="text-sm text-slate-600 mt-1.5">Paste this one line just before <code className="text-[12px] bg-slate-100 px-1 rounded">&lt;/body&gt;</code> on your site. A gold chat button appears bottom-right, greets visitors and books appointments. It doesn't change your site's design.</p>
        <div className="mt-4 flex items-start gap-2 rounded-xl bg-navy text-gold-soft p-3">
          <code className="flex-1 min-w-0 break-all text-[12.5px] font-mono">{snippet}</code>
          <CopyBtn text={snippet} k="snippet" />
        </div>
        <ul className="mt-4 text-[13px] text-slate-600 space-y-1.5">
          <li><b className="text-navy">WordPress:</b> a header/footer code plugin (e.g. WPCode) → Footer → paste.</li>
          <li><b className="text-navy">Wix:</b> Settings → Custom Code → Add Code → Body - end.</li>
          <li><b className="text-navy">Shopify:</b> Online Store → Themes → Edit code → theme.liquid → before &lt;/body&gt;.</li>
          <li><b className="text-navy">Custom site:</b> your developer pastes it into the footer template.</li>
        </ul>
      </div>
      <div className="rounded-2xl bg-white ring-1 ring-black/5 p-5">
        <div className="flex items-center gap-2 font-bold text-navy text-lg"><Icon name="link" size={20} /> Share your booking link</div>
        <p className="text-sm text-slate-600 mt-1.5">The same assistant as a full page. Put it in your Instagram & Facebook bio, WhatsApp Business auto-reply, Google Business profile and ads.</p>
        <div className="mt-4 flex items-center gap-2 rounded-xl bg-slate-50 ring-1 ring-slate-200 p-3">
          <code className="flex-1 min-w-0 break-all text-[12.5px] font-mono text-navy">{base}</code>
          <CopyBtn text={base} k="link" />
        </div>
        <a href={`https://wa.me/?text=${encodeURIComponent(`Book your free study-abroad consultation with ${C.brand.name}: ${base}`)}`} target="_blank" rel="noopener"
          className="mt-3 inline-flex items-center gap-1.5 rounded-xl bg-[#25D366] text-white text-sm font-semibold px-4 py-2.5"><Icon name="wa" size={16} /> Share on WhatsApp</a>
      </div>
      {local && (
        <div className="lg:col-span-2 rounded-2xl bg-amber-50 ring-1 ring-amber-200 text-amber-900 text-[13px] p-4">
          You're viewing a local copy, so the code and link above only work on this computer. Once these files are hosted (e.g. GitHub Pages), this tab shows the real code and link.
        </div>
      )}
    </div>
  );
}

function CalendarView({ appts }) {
  const [start, setStart] = useState(todayYmd());
  const [sel, setSel] = useState(todayYmd());
  const week = nextDays(7, start);
  const times = allSlotTimes();
  const active = appts.filter(a => a.status !== "Cancelled");
  const dayInfo = d => {
    const booked = active.filter(a => a.date === d).length;
    const open = isWorkingDay(d);
    const free = open ? times.filter(t => slotEpoch(d, t) > Date.now() && !isBooked(appts, d, t)).length : 0;
    return { booked, free, open };
  };
  const shift = n => { const s = addDays(start, n); setStart(s); setSel(s); };
  const info = dayInfo(sel);

  return (
    <div className="mt-4 grid lg:grid-cols-[300px_1fr] gap-4">
      <div className="rounded-2xl bg-white ring-1 ring-black/5 p-3">
        <div className="flex items-center justify-between px-1 pb-2">
          <button onClick={() => shift(-7)} className="h-8 w-8 rounded-lg hover:bg-slate-100 grid place-items-center"><Icon name="chevL" size={16} /></button>
          <div className="text-sm font-semibold text-navy">{fmtDay(week[0]).split(", ")[1]} – {fmtDay(week[6]).split(", ")[1]}</div>
          <button onClick={() => shift(7)} className="h-8 w-8 rounded-lg hover:bg-slate-100 grid place-items-center"><Icon name="chevR" size={16} /></button>
        </div>
        <div className="flex lg:flex-col gap-2 overflow-x-auto scroll-thin pb-1">
          {week.map(d => {
            const i = dayInfo(d);
            return (
              <button key={d} onClick={() => setSel(d)} className={"shrink-0 lg:w-full text-left rounded-xl px-3 py-2.5 ring-1 transition min-w-[120px] " + (sel === d ? "bg-navy text-white ring-navy" : "ring-slate-200 hover:ring-gold")}>
                <div className="font-semibold text-sm">{dayLabel(d)}{dayLabel(d) !== fmtDay(d) && <span className={"font-normal " + (sel === d ? "text-white/60" : "text-slate-400")}> · {fmtDay(d).split(", ")[1]}</span>}</div>
                <div className={"text-[11.5px] mt-0.5 " + (sel === d ? "text-white/70" : "text-slate-500")}>{i.open ? `${i.booked} booked · ${i.free} free` : "Closed"}</div>
              </button>
            );
          })}
        </div>
        {start !== todayYmd() && <button onClick={() => { setStart(todayYmd()); setSel(todayYmd()); }} className="mt-2 w-full text-sm text-navy font-semibold py-2 rounded-lg hover:bg-slate-50">Jump to today</button>}
      </div>

      <div className="rounded-2xl bg-white ring-1 ring-black/5 p-4 sm:p-5">
        <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
          <div><div className="font-display text-2xl font-bold text-navy">{fmtDay(sel)}</div><div className="text-sm text-slate-500">{info.open ? `${info.booked} booked · ${info.free} free slots remaining · ${C.hours.slotMinutes}-min slots (PKT)` : "Office closed"}</div></div>
          <div className="flex items-center gap-3 text-[11.5px] text-slate-500"><span className="flex items-center gap-1"><span className="h-3 w-3 rounded bg-navy" /> Booked</span><span className="flex items-center gap-1"><span className="h-3 w-3 rounded border-2 border-dashed border-emerald-400" /> Free</span><span className="flex items-center gap-1"><span className="h-3 w-3 rounded bg-slate-100" /> Past</span></div>
        </div>
        {!info.open ? (
          <div className="rounded-xl bg-slate-50 text-slate-500 text-center py-16">Closed on {DAYS[dow(sel)]}day — {C.hours.label}</div>
        ) : (
          <div className="grid sm:grid-cols-2 gap-2">
            {times.map(t => {
              const a = active.find(x => x.date === sel && x.time === t);
              const past = slotEpoch(sel, t) <= Date.now();
              if (a) {
                const s = sessionOf(a.session), sc = scoreLead(a);
                return (
                  <div key={t} className="rounded-xl bg-navy text-white px-3 py-2.5 flex items-center gap-3">
                    <div className="text-[12px] font-mono text-gold w-16 shrink-0">{fmtTime(t)}</div>
                    <div className="min-w-0 flex-1"><div className="font-semibold text-sm truncate">{a.name}</div><div className="text-[11.5px] text-white/60 truncate">{s.icon} {s.short} · {countryLabel(a)} · {a.status}</div></div>
                    <LeadBadge level={sc.level} />
                  </div>
                );
              }
              return (
                <div key={t} className={"rounded-xl px-3 py-2.5 flex items-center gap-3 " + (past ? "bg-slate-50 text-slate-400" : "border-2 border-dashed border-emerald-300 text-emerald-700")}>
                  <div className="text-[12px] font-mono w-16 shrink-0">{fmtTime(t)}</div>
                  <div className="text-sm">{past ? "—" : "Available"}</div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================== APP ============================== */
function App() {
  const [appts, setAppts] = useState(loadAppts);
  const [view, setView] = useState(() => location.hash === "#admin" ? "admin" : "book");
  const [, setTick] = useState(0);
  const chatApi = useRef(null);

  useEffect(() => { saveAppts(appts); }, [appts]);
  useEffect(() => { const i = setInterval(() => setTick(t => t + 1), 60000); return () => clearInterval(i); }, []);
  useEffect(() => {
    const onHash = () => setView(location.hash === "#admin" ? "admin" : "book");
    const onStorage = e => { if (e.key === STORE_KEY && e.newValue) { try { const v = JSON.parse(e.newValue); if (Array.isArray(v)) setAppts(v); } catch (err) {} } };
    window.addEventListener("hashchange", onHash); window.addEventListener("storage", onStorage);
    return () => { window.removeEventListener("hashchange", onHash); window.removeEventListener("storage", onStorage); };
  }, []);

  const go = v => { setView(v); try { history.replaceState(null, "", location.pathname + location.search + (v === "admin" ? "#admin" : "")); } catch (e) {} window.scrollTo(0, 0); };
  const addAppt = a => setAppts(p => [a, ...p]);
  const updateAppt = (id, patch) => setAppts(p => p.map(a => a.id === id ? { ...a, ...patch, updatedAt: Date.now() } : a));
  const resetDemo = () => { if (confirm("Reset to the 8 sample bookings? Bookings made in this browser will be removed.")) setAppts(seedAppointments()); };
  const chatProps = { appts, addAppt, updateAppt, apiRef: chatApi };

  if (EMBED) return <ChatWidget {...chatProps} mode="float" />;
  return (
    <>
      <div style={{ display: view === "admin" ? "none" : undefined }}>
        <BookingPage onAdmin={() => go("admin")} chat={chatApi} appts={appts}><ChatWidget {...chatProps} mode="page" /></BookingPage>
      </div>
      {view === "admin" && <Admin appts={appts} updateAppt={updateAppt} resetDemo={resetDemo} onExit={() => go("book")} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
